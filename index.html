  function handleCredentialResponse(response) {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    if (ALLOWED.includes(payload.email)) {
      sessionStorage.setItem('auth', '1');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('root').style.display = 'block';
      if (window.__mountDashboard) window.__mountDashboard();
    } else {
      document.getElementById('denied').style.display = 'block';
    }
  }

  function initGoogle() {
    if (sessionStorage.getItem('auth')) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('root').style.display = 'block';
      if (window.__mountDashboard) window.__mountDashboard();
      return;

    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleCredentialResponse });
    google.accounts.id.renderButton(document.getElementById('google-btn'), { theme: 'outline', size: 'large' });
  }

  function waitForGoogle() {
    if (typeof google !== 'undefined' && google.accounts) {
      initGoogle();
    } else {
      setTimeout(waitForGoogle, 100);
    }
  }
  window.addEventListener('load', waitForGoogle);

// Returns net deferred share payment for a given year key
function deferredNet(yk) {
  return DEFERRED_SHARES_DATA.reduce(function(s,r){ return s+(r.values[yk]||0); }, 0);
}

// Returns the resolved value for a FORWARD_PROVISIONS row for a given year key
function fwdValue(item, yk) {
  if (item.computeFromDeferred) {
    return -Math.round(deferredNet(yk) * item.deferredRate);
  }
  return item.values[yk] || 0;
}

// Single source of truth for provisions across any set of years.
// Pass yearKeys = YEAR_2026 for current-year view, ALL_YEARS for grand total.
// 2026: each provision contributes -getProvisionRemaining (positive remaining = obligation = negative to net worth)
// 2027-2030: each FORWARD_PROVISIONS entry already stores its value as negative
function provisionTotal(yearKeys) {
  var total = 0;
  yearKeys.forEach(function(yk) {
    if (yk === "y2026") {
      PROVISIONS_DATA.forEach(function(p) {
        total += getProvisionRemaining(p);  // getProvisionRemaining already returns negative for normal provisions
      });
    } else {
      FORWARD_PROVISIONS.forEach(function(p) {
        total += fwdValue(p, yk);
      });
    }
  });
  return total;
}

// Shared helper — single source of truth for provision remaining balance
// Used by both ProvisionsTab and SummaryTab to guarantee they always match
function getProvisionRemaining(p) {
  var drawn = (p.drawdowns || []).reduce(function(s, d) { return s + d.amount; }, 0);
  var rem = p.opening - drawn;
  return p.isIncome ? rem : -rem;
}
// Returns a function isAllocated(mk, amount) -> bool
function buildAllocationMap() {
  // Build allocation counts keyed by mk + category + amount
  var allocCount = {};
  PROVISIONS_DATA.forEach(function(p) {
    var allEntries = (p.drawdowns || []).concat(p.excludes || []);
    allEntries.forEach(function(d) {
      var mk = d.date === "Sep 2025" ? "2025-09" : d.date === "Oct 2025" ? "2025-10" : d.date === "Nov 2025" ? "2025-11" : d.date === "Dec 2025" ? "2025-12" : d.date === "Jan 2026" ? "2026-01" : d.date === "Feb 2026" ? "2026-02" : d.date === "Mar 2026" ? "2026-03" : d.date === "Apr 2026" ? "2026-04" : d.date === "May 2026" ? "2026-05" : null;
      if (!mk || !d.cat || d.amount < 0) return; // skip refunds and untagged
      var key = mk + "|" + d.cat + "|" + Math.round(d.amount * 100);
      allocCount[key] = (allocCount[key] || 0) + 1;
    });
  });

  // Pre-match transactions to drawdowns by category + amount, storing matched indices
  var matchedIdx = new Set();
  Object.keys(allocCount).forEach(function(key) {
    var parts = key.split("|");
    var mk = parts[0];
    var cat = parts[1];
    var amtCents = parseInt(parts[2]);
    var slots = allocCount[key];
    var matched = 0;
    for (var i = 0; i < RAW_TRANSACTIONS.length; i++) {
      if (matched >= slots) break;
      var t = RAW_TRANSACTIONS[i];
      if (getMonthKey(t.date) === mk
          && resolveCategory(t) === cat
          && Math.round(Math.abs(t.amount) * 100) === amtCents
          && t.amount < 0
          && !matchedIdx.has(i)) {
        matchedIdx.add(i);
        matched++;
      }
    }
  });

  return function(mk, amount) {
    var amtCents = Math.round(Math.abs(amount) * 100);
    for (var i = 0; i < RAW_TRANSACTIONS.length; i++) {
      if (matchedIdx.has(i)) {
        var t = RAW_TRANSACTIONS[i];
        if (getMonthKey(t.date) === mk && Math.round(Math.abs(t.amount) * 100) === amtCents) {
          return true;
        }
      }
    }
    return false;
  };
}

// Computed once at module level — single source of truth for all tabs
var ALLOCATION_MAP = buildAllocationMap();

function resolveCategory(t) {
  var merchant = (t.merchant || "").toLowerCase().trim();
  if (merchant === "interest" || merchant === "interest earned") return "Interest";
  if (merchant === "daals" && t.amount === -799.98 && t.date === "2025-12-29") return "Home & Family";
  // Trip to Lill's — recategorise eating out and specific general transactions to Holidays
  if (t.category === "Eating Out" && t.date >= "2025-12-27" && t.date <= "2025-12-31") return "Holidays";
  if (t.category === "Eating Out" && t.date === "2026-01-01" &&

     t.merchant === "Société Des Autoroutes DU Nord ET DE L'est" ||

  if (t.category === "General" && t.date >= "2025-12-26" && t.date <= "2025-12-31" &&

     t.merchant === "Doodah" ||
     t.merchant === "Claire's Accessories")) return "Holidays";
  return t.category;
}

                <th key={m+"-a"} style={{ textAlign: "right", padding: "10px 8px", color: STYLE.text, fontWeight: "bold", fontSize: "11px" }}>{m}</th>,
                <th key={m+"-d"} style={{ textAlign: "right", padding: "10px 12px", color: STYLE.blue, fontWeight: "bold", fontSize: "11px", borderRight: "1px solid #1a2030" }}>Diff</th>,
              ];
            })}
          </tr>
        </thead>
        <tbody>
          <tr><td colSpan={10} style={{ padding: "8px 12px", color: STYLE.gold, fontSize: "10px", letterSpacing: "2px", textTransform: "uppercase", background: "#181e28" }}>Income</td></tr>
          <Row label="Salary" cat="Salary" est={BUDGET_DATA.salary} mkActualFn={function(mk){ return actualSalary[mk]; }} indent={true} isIncome={true} />

          <tr><td colSpan={10} style={{ padding: "8px 12px", color: STYLE.gold, fontSize: "10px", letterSpacing: "2px", textTransform: "uppercase", background: "#181e28" }}>Day-to-Day Costs</td></tr>
          {DAY_TO_DAY_CATS.map(function(cat) {
            var est = BUDGET_DATA.categories[cat] !== undefined ? BUDGET_DATA.categories[cat] : null;
            var selMk = selected && selected.endsWith("|" + cat) ? selected.split("|")[0] : null;
            return [
              <Row key={cat} label={cat} cat={cat} est={est} mkActualFn={function(mk){ return getActual(mk,cat) || null; }} indent={true} clickable={true} />,
              selMk ? <DrillDown key={cat+"-drill"} mk={selMk} cat={cat} /> : null,
            ];
          })}
          <Row label="School Fees (pro-rata)" cat={null} est={SCHOOL_FEES_PRORATA} mkActualFn={function(mk){ return SCHOOL_FEES_PRORATA; }} indent={true} muted={true} />
          <Row label="Day-to-Day Total" cat={null} est={d2dEst} mkActualFn={function(mk){ return actualD2d[mk]; }} bold={true} highlight={true} />
          <Row label="Net Operating Total" cat={null} est={estOpNet} mkActualFn={function(mk){ return actualSalary[mk] + actualD2d[mk]; }} bold={true} highlight={true} isIncome={true} />

          {extraCats.length > 0 && [
            <tr key="unbudgeted-hdr"><td colSpan={10} style={{ padding: "8px 12px", color: STYLE.amber, fontSize: "10px", letterSpacing: "2px", textTransform: "uppercase", background: "#181e28" }}>Unbudgeted (no estimate set)</td></tr>,
            extraCats.map(function(cat) {
              var selMk = selected && selected.endsWith("|" + cat) ? selected.split("|")[0] : null;
              return [
                <Row key={cat} label={cat} cat={cat} est={null} mkActualFn={function(mk){ return getActual(mk,cat) || null; }} indent={true} clickable={true} />,
                selMk ? <DrillDown key={cat+"-drill"} mk={selMk} cat={cat} /> : null,
              ];
            })
          ]}
        </tbody>
      </table>
      <p style={{ marginTop: "12px", fontSize: "11px", color: STYLE.textMuted, fontStyle: "italic" }}>
        Click any actual amount to see transactions. Diff: green = favourable, red = unfavourable.
      </p>
    </div>
  );
}


// ============================================================
// TAB: MONTHLY VIEW (formerly P&L)
// ============================================================

function PnLTab({ monthlyData }) {
  // Build unified column list: historical (blank) + live transaction months
  // Columns run right-to-left visually: Apr-26, Mar-26, Feb-26, Jan-26, Dec-25, Nov-25, Oct-25
  var ALL_MONTHS = [
    { mk: "2026-05", label: "May-26", live: true },
    { mk: "2026-04", label: "Apr-26", live: true },
    { mk: "2026-03", label: "Mar-26", live: true },
    { mk: "2026-02", label: "Feb-26", live: false },
    { mk: "2026-01", label: "Jan-26", live: false },
    { mk: "2025-12", label: "Dec-25", live: false },
    { mk: "2025-11", label: "Nov-25", live: false },
    { mk: "2025-10", label: "Oct-25", live: false },
  ];

  // Build a lookup for historical data by mk
  var histMap = {};
  HISTORICAL_MONTHLY.forEach(function(h) { histMap[h.mk] = h; });

  function getVal(mk, cat) {
    if (monthlyData[mk]) return monthlyData[mk].categories[cat] || 0;
    if (histMap[mk] && histMap[mk].categories[cat] !== null) return histMap[mk].categories[cat];
    return null;
  }
  function getProvVal(mk, cat) {
    if (monthlyData[mk]) return monthlyData[mk].provisions[cat] || 0;
    if (histMap[mk] && histMap[mk].provisions[cat] !== null) return histMap[mk].provisions[cat];
    return null;
  }
  function getIncome(mk) {
    if (monthlyData[mk]) return monthlyData[mk].income || 0;
    if (histMap[mk] && histMap[mk].income !== null) return histMap[mk].income;
    return null;
  }

  var SCHOOL_FEES_PRORATA = -3294.60;
  var salaryAdj = -6247;

  // Live months only for summary boxes
  var LIVE_MKS = ALL_MONTHS.filter(function(m){ return m.live; }).map(function(m){ return m.mk; });
  var salary3mo = LIVE_MKS.reduce(function(s, mk) { return s + (monthlyData[mk] ? monthlyData[mk].income : 0); }, 0) + salaryAdj;
  var d2dTotal3mo = DAY_TO_DAY_CATS.reduce(function(s, c) {
    return s + LIVE_MKS.reduce(function(s2, mk) { return s2 + (monthlyData[mk] ? (monthlyData[mk].categories[c] || 0) : 0); }, 0);
  }, 0) + SCHOOL_FEES_PRORATA * LIVE_MKS.length;
  var opNet3mo = salary3mo + d2dTotal3mo;
  var provTotal3mo = PROVISION_DISPLAY_CATS.reduce(function(s, c) {
    return s + LIVE_MKS.reduce(function(s2, mk) { return s2 + (monthlyData[mk] ? (monthlyData[mk].provisions[c] || 0) : 0); }, 0);
  }, 0);

  var colCount = ALL_MONTHS.length + 2; // label + all months + 3mo total

  function Row({ label, mkFn, liveTotal, indent, bold, highlight, muted }) {
    var baseColor = muted ? STYLE.textMuted : bold ? STYLE.text : STYLE.textSub;
    var bg = highlight ? "#1a2030" : "transparent";
    return (
      <tr style={{ borderBottom: "1px solid #1a1e28", background: bg }}>
        <td style={{ padding: "7px 12px 7px " + (indent ? "24px" : "12px"), color: baseColor, fontSize: "12px", fontWeight: bold ? "bold" : "normal" }}>{label}</td>
        {ALL_MONTHS.map(function(col) {
          var v = mkFn(col.mk, col.live);
          var color = v === null ? "#3a4a5a" : col.live ? (bold ? STYLE.text : colN(v)) : STYLE.textMuted;
          if (bold && v !== null && col.live) color = colN(v);
          return (
            <td key={col.mk} style={{ textAlign: "right", padding: "7px 12px", fontSize: "12px", color: color, fontWeight: bold ? "bold" : "normal" }}>
              {v === null ? "-" : fmtN(v)}
            </td>
          );
        })}
        <td style={{ textAlign: "right", padding: "7px 12px", fontSize: "12px", color: liveTotal === null ? "#3a4a5a" : colN(liveTotal), fontWeight: bold ? "bold" : "normal", borderLeft: "1px solid " + STYLE.border }}>
          {liveTotal === null ? "-" : fmtN(liveTotal)}
        </td>
      </tr>
    );
  }

  var summaryBoxes = [
    { label: "Net Operating Total (3mo)", value: opNet3mo, desc: "Salary less day-to-day" },
  ];

  // Compute totals for live months only (3mo total column)
  function liveCatTotal(cat) {
    return MONTH_KEYS.reduce(function(s, mk) { return s + (monthlyData[mk] ? (monthlyData[mk].categories[cat] || 0) : 0); }, 0);
  }
  function liveProvTotal(cat) {
    return MONTH_KEYS.reduce(function(s, mk) { return s + (monthlyData[mk] ? (monthlyData[mk].provisions[cat] || 0) : 0); }, 0);
  }

  var tHeadCols = [{ label: "Item" }]
    .concat(ALL_MONTHS.map(function(col) { return { label: col.label, right: true }; }))
    .concat([{ label: "3mo Total", right: true }]);

  return (
    <div>
      <div style={{ display: "flex", gap: "16px", marginBottom: "28px" }}>
        {summaryBoxes.map(function(b) {
          return (
            <div key={b.label} style={{ background: STYLE.card, border: "1px solid " + STYLE.border, borderRadius: "4px", padding: "16px 20px", minWidth: "160px" }}>
              <div style={{ fontSize: "10px", color: STYLE.textMuted, letterSpacing: "1px", textTransform: "uppercase", marginBottom: "6px" }}>{b.label}</div>
              <div style={{ fontSize: "20px", color: colN(b.value), fontWeight: "300" }}>{fmtN(b.value)}</div>
              <div style={{ fontSize: "10px", color: STYLE.textMuted, marginTop: "4px" }}>{b.desc}</div>
            </div>
          );
        })}
        <div style={{ width: "1px", background: STYLE.border, margin: "0 8px" }}></div>
        <div style={{ background: STYLE.card, border: "1px dashed " + STYLE.border, borderRadius: "4px", padding: "16px 20px", minWidth: "160px" }}>
          <div style={{ fontSize: "10px", color: STYLE.textMuted, letterSpacing: "1px", textTransform: "uppercase", marginBottom: "6px" }}>Provisioned (3mo)</div>
          <div style={{ fontSize: "20px", color: colN(provTotal3mo), fontWeight: "300" }}>{fmtN(provTotal3mo)}</div>
          <div style={{ fontSize: "10px", color: STYLE.textMuted, marginTop: "4px" }}>Provision-backed spend</div>
        </div>
      </div>

      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px" }}>
        <thead>
          <tr style={{ background: "#1a2030", borderBottom: "2px solid " + STYLE.border }}>
            <th style={{ textAlign: "left", padding: "8px 12px", color: STYLE.textMuted, fontWeight: "normal", fontSize: "11px" }}>Item</th>
            {ALL_MONTHS.map(function(col) {
              return (
                <th key={col.mk} style={{ textAlign: "right", padding: "8px 12px", color: col.live ? STYLE.text : "#3a4a5a", fontWeight: col.live ? "bold" : "normal", fontSize: "11px" }}>
                  {col.label}
                </th>
              );
            })}
            <th style={{ textAlign: "right", padding: "8px 12px", color: STYLE.blue, fontWeight: "bold", fontSize: "11px", borderLeft: "1px solid " + STYLE.border }}>3mo Total</th>
          </tr>
        </thead>
        <tbody>
          <Row label="Salary - James"
            mkFn={function(mk){ var v = getIncome(mk); return v === 0 ? null : v; }}
            liveTotal={salary3mo - salaryAdj}
            indent={true} />
          <Row label="Adjustment - Share Monies"
            mkFn={function(mk){ return mk === "2026-02" ? salaryAdj : null; }}
            liveTotal={salaryAdj}
            indent={true} muted={true} />

          {DAY_TO_DAY_CATS.map(function(cat) {
            var lt = liveCatTotal(cat);
            return <Row key={cat} label={cat}
              mkFn={function(mk){ return getVal(mk, cat) || null; }}
              liveTotal={lt || null}
              indent={true} />;
          })}
          <Row label="School Fees (pro-rata)"
            mkFn={function(mk){ return SCHOOL_FEES_PRORATA; }}
            liveTotal={SCHOOL_FEES_PRORATA * LIVE_MKS.length}
            indent={true} />
          <Row label="Day-to-Day Total"
            mkFn={function(mk){
              var inc = getIncome(mk);
              var d2d = DAY_TO_DAY_CATS.reduce(function(s,c){ var v = getVal(mk,c); return s + (v || 0); }, 0);
              return inc !== null || d2d !== 0 ? d2d + SCHOOL_FEES_PRORATA : null;
            }}
            liveTotal={d2dTotal3mo}
            bold={true} highlight={true} />
          <Row label="Net Operating Total"
            mkFn={function(mk){
              var inc = getIncome(mk);
              if (inc === null) return null;
              var adj = mk === "2026-02" ? salaryAdj : 0;
              var d2d = DAY_TO_DAY_CATS.reduce(function(s,c){ var v = getVal(mk,c); return s + (v || 0); }, 0);
              return inc + adj + d2d + SCHOOL_FEES_PRORATA;
            }}
            liveTotal={opNet3mo}
            bold={true} highlight={true} />

          {PROVISION_DISPLAY_CATS.map(function(cat) {
            var lt = liveProvTotal(cat);
            return <Row key={cat} label={cat}
              mkFn={function(mk){ return getProvVal(mk, cat) || null; }}
              liveTotal={lt || null}
              indent={true} muted={true} />;
          })}
          <Row label="School Fees (pro-rata offset)"
            mkFn={function(mk){ return 3294.60; }}
            liveTotal={3294.60 * LIVE_MKS.length}
            indent={true} muted={true} />
          <Row label="Provisioned Spend Total"
            mkFn={function(mk){
              return PROVISION_DISPLAY_CATS.reduce(function(s,c){ var v = getProvVal(mk,c); return s + (v || 0); }, 0) || null;
            }}
            liveTotal={provTotal3mo}
            bold={true} highlight={true} />
        </tbody>
      </table>
      <p style={{ marginTop: "8px", fontSize: "11px", color: STYLE.textMuted, fontStyle: "italic" }}>
        3mo Total covers the live transaction window only (Feb–Apr 26). Greyed columns are pending historical data.
      </p>
    </div>
  );
}

// TAB: PROVISIONS
// ============================================================

function ProvisionsTab() {
  var openNotes = React.useState(null);
  var expandedNote = openNotes[0];
  var setExpandedNote = openNotes[1];

  var ALL_PROV_MONTHS = [
    { mk: "2026-05", prefix: "May 2026", label: "May-26" },
    { mk: "2026-04", prefix: "Apr 2026", label: "Apr-26" },
    { mk: "2026-03", prefix: "Mar 2026", label: "Mar-26" },
    { mk: "2026-02", prefix: "Feb 2026", label: "Feb-26" },
    { mk: "2026-01", prefix: "Jan 2026", label: "Jan-26" },
    { mk: "2025-12", prefix: "Dec 2025", label: "Dec-25" },
    { mk: "2025-11", prefix: "Nov 2025", label: "Nov-25" },
    { mk: "2025-10", prefix: "Oct 2025", label: "Oct-25" },
  ];
  var cols = [
    { label: "Provision" }, { label: "Remaining", right: true },
    ...ALL_PROV_MONTHS.map(function(m){ return { label: m.label, right: true }; }),
    { label: "Type" }, { label: "Opening", right: true },
  ];

  // drawdowns ONLY — prefix is full month string e.g. "Apr 2026"
  function getDrawn(p, prefix) {
    return (p.drawdowns || []).filter(function(d){ return d.date === prefix; })
      .reduce(function(s,d){ return s + d.amount; }, 0);
  }

  var totalRem = PROVISIONS_DATA.reduce(function(s, p) {
    return s + getProvisionRemaining(p);
  }, 0);

  var detailProvisions = PROVISIONS_DATA.filter(function(p) {
    return (p.drawdowns||[]).some(function(d){
      return d.date === "May 2026" || d.date === "Apr 2026" || d.date === "Mar 2026" || d.date === "Feb 2026";
    });
  });

  return (
    <div>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px" }}>
        <THead cols={cols} />
        <tbody>
          {PROVISIONS_DATA.map(function(p, i) {
            var rem = getProvisionRemaining(p);
            return (
              <tr key={p.name} style={{ borderBottom: "1px solid #1a1e28", background: "transparent" }}>
                <td style={{ padding: "10px 12px", color: STYLE.textSub }}>{p.name}</td>
                <td style={{ textAlign: "right", padding: "10px 12px", color: colN(rem) }}>{fmtN(rem)}</td>
                {ALL_PROV_MONTHS.map(function(m) {
                  var v = getDrawn(p, m.prefix);
                  return <td key={m.mk} style={{ textAlign: "right", padding: "10px 12px", color: v ? STYLE.amber : STYLE.textMuted }}>{v ? fmtN(-v) : "-"}</td>;
                })}
                <td style={{ padding: "10px 12px", color: STYLE.textMuted, fontSize: "11px" }}>{p.isIncome ? "Income" : "Provision"}</td>
                <td style={{ textAlign: "right", padding: "10px 12px", color: STYLE.textMuted }}>{fmtN(p.opening)}</td>
              </tr>
            );
          })}
          <tr style={{ borderTop: "2px solid " + STYLE.border, background: "#1e2838" }}>
            <td style={{ padding: "10px 12px", color: STYLE.blue, fontWeight: "bold" }}>Net Remaining</td>
            <td style={{ textAlign: "right", padding: "10px 12px", color: colN(-totalRem), fontWeight: "bold" }}>{fmtN(totalRem)}</td>
            {ALL_PROV_MONTHS.map(function(m) {
              var mTotal = PROVISIONS_DATA.reduce(function(s,p){ return s + getDrawn(p,m.prefix); }, 0);
              return <td key={m.mk} style={{ textAlign: "right", padding: "10px 12px", color: mTotal ? STYLE.amber : STYLE.textMuted, fontWeight: "bold" }}>{mTotal ? fmtN(-mTotal) : "-"}</td>;
            })}
            <td style={{ padding: "10px 12px" }}></td>
            <td style={{ textAlign: "right", padding: "10px 12px", color: STYLE.textMuted, fontWeight: "bold" }}>{fmtN(PROVISIONS_DATA.reduce(function(s,p){ return s+p.opening; },0))}</td>
          </tr>
          <tr style={{ background: "#1a1e28" }}>
            <td style={{ padding: "8px 12px", color: STYLE.textMuted, fontSize: "11px", fontStyle: "italic" }}>School Fees pro-rata offset</td>
            <td style={{ textAlign: "right", padding: "8px 12px", color: STYLE.textMuted, fontSize: "11px", fontStyle: "italic" }}>+£3,295/mo</td>
            {MONTH_KEYS.map(function(mk) {
              return <td key={mk} style={{ textAlign: "right", padding: "8px 12px", color: STYLE.green, fontSize: "11px" }}>£3,295</td>;
            })}
            <td colSpan={2} style={{ padding: "8px 12px", color: STYLE.textMuted, fontSize: "11px", fontStyle: "italic" }}>{"Termly fees offset in P&L \u2014 not a provision movement"}</td>
          </tr>
        </tbody>
      </table>

      {detailProvisions.length > 0 && (
        <div style={{ marginTop: "32px" }}>
          <div style={{ fontSize: "11px", color: STYLE.gold, letterSpacing: "2px", textTransform: "uppercase", marginBottom: "16px" }}>Drawdown Detail</div>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px" }}>
            <thead>
              <tr style={{ background: "#1a2030", borderBottom: "2px solid " + STYLE.border }}>
                <th style={{ textAlign: "left", padding: "7px 12px", color: STYLE.textMuted, fontWeight: "normal", width: "220px" }}>Sub-category</th>
                {ALL_PROV_MONTHS.map(function(m) {
                  return <th key={m.mk} style={{ textAlign: "right", padding: "7px 12px", color: STYLE.blue, fontWeight: "bold" }}>{m.label}</th>;
                })}
                <th style={{ textAlign: "right", padding: "7px 12px", color: STYLE.text, fontWeight: "bold" }}>Total</th>
              </tr>
            </thead>
            <tbody>
              {detailProvisions.map(function(p) {
                var allMonths = ALL_PROV_MONTHS.map(function(m){ return m.prefix; });
                var drawdownRows = (p.drawdowns||[]).filter(function(d){
                  return allMonths.indexOf(d.date) !== -1;
                });
                if (!drawdownRows.length) return null;

                var subCats = {};
                drawdownRows.forEach(function(d) {
                  if (!subCats[d.desc]) subCats[d.desc] = {};
                  subCats[d.desc][d.date] = (subCats[d.desc][d.date] || 0) + d.amount;
                });
                var grandTotal = drawdownRows.reduce(function(s,d){ return s+d.amount; }, 0);

                return [
                  // Provision name as section header row
                  <tr key={p.name + "-hdr"} style={{ background: "#181e28", borderTop: "2px solid #1a2030" }}>
                    <td colSpan={ALL_PROV_MONTHS.length + 2} style={{ padding: "6px 12px", color: STYLE.text, fontWeight: "bold", fontSize: "12px" }}>{p.name}</td>
                  </tr>,
                  // Sub-category rows
                  Object.keys(subCats).map(function(desc) {
                    var monthAmts = subCats[desc];
                    var rowTotal = Object.values(monthAmts).reduce(function(s,v){ return s+v; }, 0);
                    return (
                      <tr key={p.name + desc} style={{ borderBottom: "1px solid #1a1e28", background: "transparent" }}>
                        <td style={{ padding: "6px 12px 6px 20px", color: STYLE.textSub }}>{desc}</td>
                        {ALL_PROV_MONTHS.map(function(m) {
                          var v = monthAmts[m.prefix] || 0;
                          return (
                            <td key={m.mk} style={{ textAlign: "right", padding: "6px 12px", color: v ? (v < 0 ? STYLE.green : STYLE.amber) : "#3a4a5a" }}>
                              {v ? fmtN(-v) : "—"}
                            </td>
                          );
                        })}
                        <td style={{ textAlign: "right", padding: "6px 12px", color: rowTotal < 0 ? STYLE.green : STYLE.amber, fontWeight: "bold" }}>
                          {fmtN(-rowTotal)}
                        </td>
                      </tr>
                    );
                  }),
                  // Provision total row
                  <tr key={p.name + "-total"} style={{ borderBottom: "2px solid #1a2030", background: "#1a2030" }}>
                    <td style={{ padding: "6px 12px 6px 20px", color: STYLE.blue, fontWeight: "bold" }}>Total</td>
                    {ALL_PROV_MONTHS.map(function(m) {
                      var mTotal = drawdownRows.filter(function(d){ return d.date === m.prefix; }).reduce(function(s,d){ return s+d.amount; }, 0);
                      return <td key={m.mk} style={{ textAlign: "right", padding: "6px 12px", color: mTotal ? STYLE.amber : "#3a4a5a", fontWeight: "bold" }}>{mTotal ? fmtN(-mTotal) : "—"}</td>;
                    })}
                    <td style={{ textAlign: "right", padding: "6px 12px", color: STYLE.blue, fontWeight: "bold" }}>{fmtN(-grandTotal)}</td>
                  </tr>,
                ];
              })}
            </tbody>
          </table>
        </div>
      )}

      {detailProvisions.length > 0 && (
        <div style={{ marginTop: "32px" }}>
          <div style={{ fontSize: "11px", color: STYLE.gold, letterSpacing: "2px", textTransform: "uppercase", marginBottom: "16px" }}>Transaction Detail</div>
          {detailProvisions.map(function(p) {
            var isOpen = expandedNote === ("txn-" + p.name);
            // Collect all Snoop categories used by this provision's drawdowns + excludes
            var cats = {};
            (p.drawdowns || []).forEach(function(d){ if (d.cat) cats[d.cat] = true; });
            (p.excludes || []).forEach(function(d){ if (d.cat) cats[d.cat] = true; });
            var catList = Object.keys(cats);
            // All raw transactions for this provision's categories, within the window months + Jan
            var txns = RAW_TRANSACTIONS.filter(function(t){
              var mk = getMonthKey(t.date);
              return (mk === "2026-04" || mk === "2026-03" || mk === "2026-02" || mk === "2026-01")
                && catList.indexOf(resolveCategory(t)) !== -1;
            }).sort(function(a,b){ return b.date.localeCompare(a.date); });
            var txnTotal = txns.reduce(function(s,t){ return s+t.amount; }, 0);
            if (!txns.length) return null;
            return (
              <div key={p.name} style={{ marginBottom: "8px", border: "1px solid " + STYLE.border, borderRadius: "4px", overflow: "hidden" }}>
                <div
                  onClick={function(){ setExpandedNote(isOpen ? null : "txn-" + p.name); }}
                  style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: "transparent", cursor: "pointer", userSelect: "none" }}

}

          return vn.outstanding / 4;
        }

        // Outstanding balance at START of each payment year
        function openingBalance(payYear) {
          return ds.vnYears.reduce(function(s, vn) {
            var paid = 0;
            for (var y = 2027; y < payYear; y++) { paid += vnPayment(vn, y); }
            return s + Math.max(0, vn.outstanding - paid);

                            </tr>

                              {[2027,2028,2029,2030].map(function(py) {

                              })}
                              <td style={{ padding: "6px 12px", color: STYLE.textMuted, fontSize: "10px" }}>FX rate: {fx}</td>
                            </tr>
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  ),

                  // Prescribed Rate drill-down
                  isPresc && isOpen && (
                    <tr key="presc-detail">

    "Groceries":             "Groceries",
    "Eating Out":            "Eating Out",
    "Household Bills":       "Household Bills",
    "Transport":             "Transport",
    "Coco":                  "Coco 🐾",
    "Health & Beauty":       "Health & Beauty",
    "Entertainment":         "Entertainment",
    "General":               "General",
    "Subscriptions":         "Subscriptions",
    "Presents":              "Presents",
    "School Costs":          "School Costs",
  };

  // Build pot data including drawdown detail
  var potsByName = {};
  PROVISIONS_DATA.forEach(function(p) {
    if (!FRIENDLY[p.name]) return;
    var drawn = (p.drawdowns || []).reduce(function(s, d) { return s + d.amount; }, 0);
    var remaining = p.opening - drawn;
    var pct = Math.min(100, Math.round((drawn / p.opening) * 100));
    var drawdownLines = (p.drawdowns || []).filter(function(d){ return d.amount > 0; })
      .map(function(d){ return { label: d.desc + " (" + (d.date||"") + ")", value: -d.amount }; });
    potsByName[p.name] = {
      key: p.name,
      label: FRIENDLY[p.name].label,
      emoji: FRIENDLY[p.name].emoji,
      group: FRIENDLY[p.name].group,
      opening: p.opening,
      spent: drawn,
      remaining: remaining,
      pct: pct,
      drawdowns: drawdownLines,
    };
  });

  // Fixed commitments
  var rrProv   = PROVISIONS_DATA.find(function(p){ return p.name === "Range Rover"; });
  var flatsProv = PROVISIONS_DATA.find(function(p){ return p.name === "Flats"; });
  var sfProv   = PROVISIONS_DATA.find(function(p){ return p.name === "School Fees"; });
  var rrRemaining    = rrProv    ? rrProv.opening    - (rrProv.drawdowns||[]).reduce(function(s,d){ return s+d.amount; },0) : 0;
  var flatsRemaining = flatsProv ? flatsProv.opening - (flatsProv.drawdowns||[]).reduce(function(s,d){ return s+d.amount; },0) : 0;
  var sfRemaining    = sfProv    ? sfProv.opening    - (sfProv.drawdowns||[]).reduce(function(s,d){ return s+d.amount; },0) : 0;

  // Emergency fund
  var emergencyProv = PROVISIONS_DATA.find(function(p) { return p.name === "Cash Provision"; });
  var emergencyDrawn = emergencyProv ? (emergencyProv.drawdowns || []).reduce(function(s,d){ return s+d.amount; }, 0) : 0;
  var emergencyRemaining = emergencyProv ? emergencyProv.opening - emergencyDrawn : 0;

  function ProgressBar({ pct, remaining }) {
    var barColor = pct > 90 ? STYLE.red : pct > 70 ? "#c8a060" : STYLE.green;
    return (
      <div style={{ marginTop: "10px" }}>
        <div style={{ background: "#1a2030", borderRadius: "4px", height: "6px", overflow: "hidden" }}>
          <div style={{ width: pct + "%", height: "100%", background: barColor, borderRadius: "4px", transition: "width 0.3s" }}></div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: "4px" }}>
          <span style={{ fontSize: "10px", color: STYLE.textMuted }}>{pct}% used</span>
          <span style={{ fontSize: "10px", color: STYLE.textMuted }}>£{Math.round(remaining).toLocaleString()} left</span>
        </div>
      </div>
    );
  }

  function PotCard({ pot }) {
    var isOpen = expandedPot === pot.key;
    return (
      <div style={{ minWidth: "180px", flex: "1" }}>
        <div
          onClick={function(){ toggle(pot.key); }}
          style={{
            background: isOpen ? "#1e2c40" : STYLE.card,
            border: "1px solid " + (isOpen ? STYLE.blue : STYLE.border),
            borderRadius: isOpen ? "8px 8px 0 0" : "8px",
            padding: "16px 18px", cursor: "pointer", transition: "all 0.2s",
          }}>
          <div style={{ fontSize: "18px", marginBottom: "4px" }}>{pot.emoji}</div>
          <div style={{ fontSize: "12px", color: STYLE.textMuted, marginBottom: "2px" }}>{pot.label}</div>
          <div style={{ fontSize: "22px", color: pot.remaining < 0 ? STYLE.red : STYLE.green, fontWeight: "300", marginBottom: "2px" }}>
            {fmtN(pot.remaining)}
          </div>
          <div style={{ fontSize: "11px", color: STYLE.textMuted }}>
            spent {fmtN(-pot.spent)} of {fmtN(pot.opening)}
          </div>
          <ProgressBar pct={pot.pct} remaining={pot.remaining} />
          {pot.drawdowns.length > 0 && (
            <div style={{ fontSize: "10px", color: STYLE.blue, marginTop: "8px" }}>{isOpen ? "▲ hide detail" : "▼ tap for detail"}</div>
          )}
        </div>
        {isOpen && pot.drawdowns.length > 0 && (
          <div style={{ background: "#111827", border: "1px solid " + STYLE.blue, borderTop: "none", borderRadius: "0 0 8px 8px", padding: "12px 16px" }}>
            {pot.drawdowns.map(function(d, i) {
              return (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid #1a2030" }}>
                  <span style={{ fontSize: "11px", color: STYLE.textMuted }}>{d.label}</span>
                  <span style={{ fontSize: "11px", color: STYLE.red }}>{fmtN(d.value)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      {/* Header */}
      <div style={{ marginBottom: "28px" }}>
        <div style={{ fontSize: "20px", color: STYLE.text, fontWeight: "300", marginBottom: "4px" }}>Our Money</div>
        <div style={{ fontSize: "12px", color: STYLE.textMuted }}>What we have set aside and how we're tracking</div>
      </div>

      {/* Spending Pots by group */}
      {GROUPS.map(function(group) {
        var pots = Object.values(potsByName).filter(function(p) { return p.group === group; });
        if (!pots.length) return null;
        return (
          <div key={group} style={{ marginBottom: "32px" }}>
            <div style={{ fontSize: "10px", color: STYLE.gold, letterSpacing: "2px", textTransform: "uppercase", marginBottom: "14px" }}>{group}</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "12px", alignItems: "flex-start" }}>
              {pots.map(function(pot) { return <PotCard key={pot.key} pot={pot} />; })}
            </div>
          </div>
        );
      })}

      {/* Emergency Fund — quiet single line */}
      <div style={{ background: "#181e28", border: "1px dashed " + STYLE.border, borderRadius: "6px", padding: "12px 16px", marginBottom: "12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <span style={{ fontSize: "12px", color: STYLE.textMuted }}>🛡️ Emergency Fund — </span>
          <span style={{ fontSize: "12px", color: STYLE.textMuted }}>set aside for unexpected costs (roof, boiler etc)</span>
        </div>
        <div style={{ fontSize: "14px", color: STYLE.green, fontWeight: "bold" }}>{fmtN(emergencyRemaining)}</div>
      </div>

      {/* Fixed commitments — quiet summary line */}
      <div style={{ background: "#181e28", border: "1px dashed " + STYLE.border, borderRadius: "6px", padding: "10px 16px", marginBottom: "36px" }}>
        <div style={{ fontSize: "10px", color: STYLE.textMuted, marginBottom: "6px", textTransform: "uppercase", letterSpacing: "1px" }}>Fixed Commitments</div>
        <div style={{ display: "flex", gap: "24px", flexWrap: "wrap" }}>
          <span style={{ fontSize: "12px", color: STYLE.textMuted }}>🚗 Range Rover <span style={{ color: STYLE.red }}>{fmtN(-rrRemaining)}</span></span>
          <span style={{ fontSize: "12px", color: STYLE.textMuted }}>🎓 School Fees <span style={{ color: STYLE.green }}>{fmtN(sfRemaining)}</span></span>
          <span style={{ fontSize: "12px", color: STYLE.textMuted }}>🏢 Flats <span style={{ color: STYLE.red }}>{fmtN(-flatsRemaining)}</span></span>
        </div>
      </div>

      {/* Monthly Spending — rolling 3 months */}
      <div style={{ marginBottom: "16px" }}>
        <div style={{ fontSize: "10px", color: STYLE.gold, letterSpacing: "2px", textTransform: "uppercase", marginBottom: "14px" }}>Monthly Spending</div>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px" }}>
          <thead>
            <tr style={{ background: "#1a2030", borderBottom: "2px solid " + STYLE.border }}>
              <th style={{ textAlign: "left", padding: "8px 12px", color: STYLE.textMuted, fontWeight: "normal", fontSize: "11px" }}>Category</th>
              {MONTHS.map(function(m) {
                return <th key={m} style={{ textAlign: "right", padding: "8px 12px", color: STYLE.text, fontWeight: "bold", fontSize: "11px" }}>{m}</th>;
              })}
            </tr>
          </thead>
          <tbody>
            {/* Salary row at top */}
            <tr style={{ borderBottom: "1px solid #1a1e28", background: STYLE.card }}>
              <td style={{ padding: "8px 12px", color: STYLE.textSub }}>💰 Salary</td>
              {MONTH_KEYS.map(function(mk) {
                var v = monthlyData[mk] ? monthlyData[mk].income : 0;
                if (mk === "2026-02") v += -6247; // Adjustment - Share Monies
                return (
                  <td key={mk} style={{ textAlign: "right", padding: "8px 12px", color: STYLE.green, fontWeight: "bold" }}>
                    {v ? "£" + Math.round(v).toLocaleString() : "—"}
                  </td>
                );
              })}
            </tr>
            <tr><td colSpan={MONTHS.length + 1} style={{ padding: "4px 12px", background: "#181e28" }}></td></tr>
            {Object.keys(FRIENDLY_D2D).map(function(cat, i) {
              var hasAny = MONTH_KEYS.some(function(mk) { return monthlyData[mk] && monthlyData[mk].categories[cat]; });
              if (!hasAny) return null;
              return (
                <tr key={cat} style={{ borderBottom: "1px solid #1a1e28", background: STYLE.card }}>
                  <td style={{ padding: "8px 12px", color: STYLE.textSub }}>{FRIENDLY_D2D[cat]}</td>
                  {MONTH_KEYS.map(function(mk) {
                    var v = monthlyData[mk] ? (monthlyData[mk].categories[cat] || 0) : 0;
                    return (
                      <td key={mk} style={{ textAlign: "right", padding: "8px 12px", color: v ? STYLE.red : STYLE.textMuted }}>
                        {v ? "−£" + Math.round(Math.abs(v)).toLocaleString() : "—"}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
            {/* School Fees pro-rata row */}
            <tr style={{ borderBottom: "1px solid #1a1e28" }}>
              <td style={{ padding: "8px 12px", color: STYLE.textSub }}>School Fees (monthly)</td>
              {MONTH_KEYS.map(function(mk) {
                return <td key={mk} style={{ textAlign: "right", padding: "8px 12px", color: STYLE.red }}>−£3,295</td>;
              })}
            </tr>
            {/* Net row */}
            <tr style={{ borderTop: "2px solid " + STYLE.border, background: "#1a2030" }}>
              <td style={{ padding: "10px 12px", color: STYLE.text, fontWeight: "bold" }}>Net (Salary − Spend)</td>
              {MONTH_KEYS.map(function(mk) {
                var income = monthlyData[mk] ? monthlyData[mk].income : 0;
                if (mk === "2026-02") income += -6247; // Adjustment - Share Monies
                var spend = DAY_TO_DAY_CATS.reduce(function(s, c) {
                  return s + (monthlyData[mk] ? (monthlyData[mk].categories[c] || 0) : 0);
                }, 0) - 3294.60;
                var net = income + spend;
                return <td key={mk} style={{ textAlign: "right", padding: "10px 12px", color: net >= 0 ? STYLE.green : STYLE.red, fontWeight: "bold" }}>
                  {net >= 0 ? "£" : "−£"}{Math.round(Math.abs(net)).toLocaleString()}
                </td>;
              })}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

            {[

const MANUAL_NOTIFICATIONS = [
  // SP Stanley £38.70 Apr-26 — moved to 1k-James drawdowns
  // Sent Clive Taylor £1,980 Apr-26 — moved to Home & Family / Utility Room drawdown
];

function CandidatesTab({ candidates }) {

  MONTH_KEYS.forEach(function(mk){ byMonth[mk] = []; });

    <div>
      {/* Manual Notifications */}

        <div style={{ marginBottom: "32px" }}>
          <div style={{ fontSize: "11px", color: STYLE.gold, letterSpacing: "2px", textTransform: "uppercase", marginBottom: "10px" }}>

              {MANUAL_NOTIFICATIONS.map(function(n, i) {
                return (
                  <tr key={i} style={{ borderBottom: "1px solid #1a1e28", background: "#1a2030" }}>

          </p>
        </div>
      )}

      <p style={{ color: STYLE.textMuted, fontSize: "13px", marginBottom: "24px", fontStyle: "italic" }}>
        No unreconciled provision transactions — all Mar–May 2026 transactions have been attributed. New candidates will appear here after the next Snoop upload.

      {MONTH_KEYS.map(function(mk) {
        var items = byMonth[mk];

          <div key={mk} style={{ marginBottom: "28px" }}>
            <SectionHeader>{MONTHS[MONTH_KEYS.indexOf(mk)]}</SectionHeader>

              <THead cols={[{ label: "Date" }, { label: "Merchant" }, { label: "Category" }, { label: "Amount", right: true }]} />

                {items.map(function(t, i) {
                  return (
                    <tr key={i} style={{ borderBottom: "1px solid #1a1e28", background: STYLE.card }}>

                      <td style={{ padding: "6px 12px", color: STYLE.textMuted, fontSize: "11px" }}>{t.category}</td>
                      <td style={{ textAlign: "right", padding: "6px 12px", color: STYLE.amber }}>{fmtN(t.amount)}</td>

}

function Dashboard() {
  var [activeTab, setActiveTab] = useState("ourmoney");

  

  var monthlyData = useMemo(function() {
    var data = {};
    MONTH_KEYS.forEach(function(mk) {
      data[mk] = { income: 0, categories: {}, provisions: {} };
      DAY_TO_DAY_CATS.forEach(function(c){ data[mk].categories[c] = 0; });
      PROVISION_DISPLAY_CATS.forEach(function(c){ data[mk].provisions[c] = 0; });
    });

    // Provisions: read from PROVISIONS_DATA.drawdowns — single source of truth
    // shared with the Annual Provisions tab. Drawdowns stored as positive costs /
    // negative refunds. monthlyData.provisions uses negative = cost (raw txn convention).
    var mkPrefix = { "2026-05": "May", "2026-04": "Apr", "2026-03": "Mar" };
    PROVISIONS_DATA.forEach(function(p) {
      if (!PROVISION_DISPLAY_CATS.includes(p.name)) return;
      (p.drawdowns || []).forEach(function(d) {
        var mk = Object.keys(mkPrefix).find(function(k){ return d.date.startsWith(mkPrefix[k]); });
        if (!mk || !data[mk]) return;
        data[mk].provisions[p.name] = (data[mk].provisions[p.name] || 0) - d.amount;
      });
    });

    var isAllocated = ALLOCATION_MAP;
    RAW_TRANSACTIONS.forEach(function(t) {
      var mk = getMonthKey(t.date);
      if (!data[mk]) return;
      var cat = resolveCategory(t);
      if (INCOME_CATS.has(cat)) {
        data[mk].income += t.amount;
      } else if (EXCLUDE_CATS.has(cat) || NON_OP_CATS.has(cat)) {
        return;
      } else if (PROVISION_DISPLAY_CATS.includes(cat)) {
        // One Off Costs has no PROVISIONS_DATA entry so reads from raw txns.
        // All other provision categories are driven by drawdowns above.
        if (cat === "One Off Costs") {
          data[mk].provisions[cat] = (data[mk].provisions[cat] || 0) + t.amount;
        }
      } else if (DAY_TO_DAY_CATS.includes(cat)) {
        if (!isAllocated(mk, t.amount)) {
          data[mk].categories[cat] = (data[mk].categories[cat] || 0) + t.amount;
        }
      }
    });
    return data;
  }, []);

  var candidates = useMemo(function() {
    var isAllocated = ALLOCATION_MAP;
    return RAW_TRANSACTIONS
      .filter(function(t) {
        if (!PROVISION_DISPLAY_CATS.includes(resolveCategory(t))) return false;
        if (t.amount >= 0) return false;
        if (t.date < "2026-05-01") return false;  // Only show May-26 onwards once reconciled
        return !isAllocated(getMonthKey(t.date), t.amount);
      })
      .sort(function(a,b){ return a.date.localeCompare(b.date); })
      .map(function(t){ return Object.assign({}, t, { amount: Math.abs(t.amount) }); });
  }, []);

  return (
    <div style={{ fontFamily: "'Georgia', 'Times New Roman', serif", background: STYLE.bg, minHeight: "100vh", color: STYLE.text }}>
      <div style={{ background: "linear-gradient(135deg, #1a1f2e 0%, #0f1117 100%)", borderBottom: "1px solid " + STYLE.border, padding: "24px 32px 20px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
          <div>
            <div style={{ fontSize: "11px", letterSpacing: "3px", color: STYLE.gold, textTransform: "uppercase", marginBottom: "4px" }}>Household Finance</div>
            <div style={{ fontSize: "26px", color: STYLE.text, fontWeight: "300", letterSpacing: "1px" }}>Spence Family</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: "11px", color: STYLE.textMuted }}>James {'&'} Jemma</div>
            <div style={{ fontSize: "11px", color: STYLE.gold }}>Mar 2026 — May 2026</div>
          </div>
        </div>
      </div>
      <div style={{ borderBottom: "1px solid " + STYLE.border, background: STYLE.card, padding: "0 32px", display: "flex" }}>
        {TABS.map(function(tab) {
          return (
            <button key={tab.id} onClick={function(){ setActiveTab(tab.id); }} style={{
              padding: "14px 20px", background: "none", border: "none", cursor: "pointer",
              color: activeTab === tab.id ? STYLE.text : STYLE.textMuted,
              borderBottom: activeTab === tab.id ? "2px solid " + STYLE.green : "2px solid transparent",
              fontSize: "12px", letterSpacing: "0.5px", fontFamily: "inherit"
            }}>
              {tab.label}
            </button>
          );
        })}
      </div>
      <div style={{ padding: "28px 32px" }}>
        {activeTab === "ourmoney" && <OurMoneyTab monthlyData={monthlyData} />}
        {activeTab === "pnl" && <PnLTab monthlyData={monthlyData} />}
        {activeTab === "budget" && <BudgetTab monthlyData={monthlyData} isAllocated={ALLOCATION_MAP} />}
        {activeTab === "provisions" && <ProvisionsTab />}
        {activeTab === "tax" && <TaxTab />}
        {activeTab === "investments" && <InvestmentsTab />}
        {activeTab === "cash" && <CashTab />}
        {activeTab === "summary" && <SummaryTab />}
        {activeTab === "bigpicture" && <BigPictureTab />}
        {activeTab === "candidates" && <CandidatesTab candidates={candidates} />}
        {activeTab === "wealth" && <WealthTab />}
        {activeTab === "admin" && <AdminTab />}
      </div>
    </div>
  );
}

window.__mountDashboard = function() {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(Dashboard));
};
if (sessionStorage.getItem("auth")) { window.__mountDashboard(); }
